<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="profileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="faceGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="64" cy="64" r="64" fill="url(#profileGradient)"/>
  
  <!-- Face shape -->
  <ellipse cx="64" cy="70" rx="25" ry="30" fill="url(#faceGradient)" filter="url(#shadow)"/>
  
  <!-- Hair -->
  <path d="M40 50 Q64 35 88 50 Q85 65 80 75 Q64 85 48 75 Q45 65 40 50" fill="#1f2937"/>
  
  <!-- Eyes -->
  <ellipse cx="58" cy="65" rx="3" ry="4" fill="#1f2937"/>
  <ellipse cx="70" cy="65" rx="3" ry="4" fill="#1f2937"/>
  <ellipse cx="58" cy="65" rx="1.5" ry="2" fill="#ffffff"/>
  <ellipse cx="70" cy="65" rx="1.5" ry="2" fill="#ffffff"/>
  
  <!-- Nose -->
  <ellipse cx="64" cy="72" rx="2" ry="3" fill="#f59e0b"/>
  
  <!-- Mouth -->
  <path d="M60 78 Q64 82 68 78" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Glasses frame -->
  <ellipse cx="58" cy="65" rx="8" ry="6" fill="none" stroke="#1f2937" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="70" cy="65" rx="8" ry="6" fill="none" stroke="#1f2937" stroke-width="1.5" opacity="0.7"/>
  <line x1="66" y1="65" x2="62" y2="65" stroke="#1f2937" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Shirt collar -->
  <path d="M50 95 Q64 105 78 95" fill="#374151" opacity="0.8"/>
  
  <!-- Subtle highlights -->
  <ellipse cx="60" cy="60" rx="8" ry="4" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="68" cy="60" rx="8" ry="4" fill="#ffffff" opacity="0.3"/>
</svg>
